# Fixture for config_slabsets_test.cpp -- a minimal slabset.toml
# exercising load_slabset_config_file()'s real Columns/objects mapping,
# modelled on the real config/fxdata/slabset.toml's own structure
# (explicit [slab0] parent, then [slab0.S] for slabstyle_no=0 -- a
# dotted table header alone, without the explicit parent, was tried
# first and found not to parse via this TOML implementation, confirmed
# by an actual load failure, not assumed). No "S_objects" sibling key
# under [slab0] -- exercises the "no objects, mark idx -1" branch (the
# real file's own [slab0.S].Objects key is a different path the loader
# never actually reads, since it looks up "S_objects" as a sibling of
# [slab0.S] under [slab0], not a key inside [slab0.S] itself).
[slab0]
[slab0.S]
Columns = [1, 2, 3, 4, 5, 6, 7, 8, 9]
