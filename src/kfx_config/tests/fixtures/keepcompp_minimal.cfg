; Fixture for config_compp_test.cpp -- a minimal keepcompp.cfg exercising
; load_computer_player_config_file()'s NamedField/parse_named_field_blocks
; field-mapping across all five block kinds it parses: the single
; unindexed [common] block (parse_named_field_block, singular -- never
; reset by set_defaults(), unlike the four indexed families below) plus
; [process1]/[check1]/[event1]/[computer0] (parse_named_field_blocks,
; plural). Process/check/event mnemonics start at index 1 -- index 0 is
; the "none configured" sentinel used by
; get_computer_process/check/event_config_list_index_mnem()'s `<= 0`
; not-found check.
[common]
ComputerAssists = 1 2 3 4
SkirmishFirst = 1
SkirmishLast = 3
DefaultComputerAssist = 2

[process1]
Name = KEEPPWR
Mnemonic = KEEPPWR
Values = 5 10 20 30 40
Functions = 0 0 0 0 0
Params = 1 2 3 4 5 6

[check1]
Name = CHECKROOM
Mnemonic = CHECKROOM
Values = 1 100
Functions = 0
Params = 1 2 3 4

[event1]
Name = EVENTATTACK
Mnemonic = EVENTATTACK
Values = 1 2 3
Functions = 0 0
Process = KEEPPWR
Params = 1 2 3 4

[computer0]
Name = COMPUTER_EASY
Values = 10 20 30 40 50 60 70
Processes = KEEPPWR
Checks = CHECKROOM
Events = EVENTATTACK
