; Fixture for config_magic_test.cpp -- one minimal block of each of
; config_magic.c's four independent block kinds parsed by
; load_magic_config_file(): [spell0]/[special0] (hand-rolled parsers,
; parse_magic_spell_blocks/parse_magic_special_blocks, numeric command
; IDs via magic_spell_commands/magic_special_commands) and
; [shot0]/[power0] (the NamedField/parse_named_field_blocks mechanism,
; via magic_shot_named_fields_set/magic_powers_named_fields_set).
; Fields needing a name lookup into a table this fixture doesn't load
; (SHOTMODEL/ARTIFACT/CREATURETYPE/CASTABILITY/USEFUNCTION/PLAYERSTATE)
; are deliberately omitted, keeping every value here numeric and
; self-contained.
[spell0]
Name = SPELL_TEST
Duration = 50
SelfCasted = 1 0 2
CastAtThing = 1

[shot0]
Name = SHOT_TEST
Health = 10
Damage = 5
ISMAGICAL = 1
Speed = 20

[power0]
Name = POWER_TEST
Power = 1 2 3 4 5 6 7 8 9
Cost = 10 20 30 40 50 60 70 80 90
Duration = 100
CostFormula = 0

[special0]
Name = SPECIAL_TEST
TooltipTextId = 5
Value = 7
