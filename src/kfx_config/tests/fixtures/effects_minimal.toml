# Fixture for config_effects_test.cpp -- one populated block of each of
# config_effects.c's three kinds (effect/effectGenerator/effectElement),
# plus a second, name-only effect/effectElement block at id 1 so
# effect_or_effect_element_id()'s "found at id 0" quirk (get_id()
# returning 0, which the `id > 0` check treats the same as not-found)
# can be exercised against a slot where it doesn't misfire.
